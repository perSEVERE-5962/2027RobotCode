name: Build

on:
  pull_request:
    types: 
      - opened
      - ready_for_review
      - synchronize
      - reopened
  push:
    branches:
      - main
      - integration

permissions:
  contents: read
  
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: wpilib/roborio-cross-ubuntu:2024-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build robot code
        run: ./gradlew build
