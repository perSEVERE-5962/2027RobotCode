name: Branch Policy

on:
  pull_request:
    types:
      - assigned
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest

    steps:
      - name: Enforce branch flow
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          echo "Source: $HEAD_REF"
          echo "Target: $BASE_REF"

          if [[ "$BASE_REF" == "main" && \
                "$HEAD_REF" != "integration" ]]; then
            echo "❌ Only integration can merge into main."
            exit 1
          fi

          echo "✅ Branch flow is valid."
