name: Branch Policy

on:
  pull_request:
    types: 
      - assigned
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  
jobs:
  branch-policy:
    name: Branch Policy
    runs-on: ubuntu-latest
    env:
      SOURCE_BRANCH: ${{ github.head_ref }}
      TARGET_BRANCH: ${{ github.base_ref }}

    steps:
      - name: Enforce branch flow
        run: |
          echo "Source: ${SOURCE_BRANCH}"
          echo "Target: ${TARGET_BRANCH}"

          if [[ "${TARGET_BRANCH}" == "main" && \
                "${SOURCE_BRANCH}" != "integration" ]]; then
            echo "❌ Only integration can merge into main."
            exit 1
          fi

          echo "✅ Branch flow is valid."
